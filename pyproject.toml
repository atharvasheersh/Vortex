[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "vortex-retrieval"
version = "0.1.0"
description = "Persistent exact and IVF vector retrieval with reproducible evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "threadpoolctl>=3"]
benchmark = ["faiss-cpu>=1.9", "matplotlib>=3.9"]
embeddings = ["sentence-transformers>=3"]
embedding-study = ["sentence-transformers[image]>=6.1", "peft>=0.15.2", "threadpoolctl>=3", "psutil>=5.9"]

[tool.scikit-build]
wheel.packages = ["python/vortex"]
cmake.args = ["-DVORTEX_PYTHON=ON", "-DBUILD_TESTING=OFF"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
