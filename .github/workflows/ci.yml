name: Build and verify
on: [push, pull_request]
jobs:
  native-and-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pybind11 numpy pytest ninja faiss-cpu
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVORTEX_PYTHON=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: python eval/run_eval.py
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DVORTEX_SANITIZERS=ON
      - run: cmake --build build-sanitize --parallel 2
      - run: ctest --test-dir build-sanitize --output-on-failure
